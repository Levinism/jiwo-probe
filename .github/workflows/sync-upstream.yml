name: Sync and deploy probe

on:
  schedule:
    # 11:23 Hong Kong time
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: production-probe
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Levinism/jiwo-probe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main
        id: source
        run: |
          previous_head=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/chnnic/jiwo-probe.git refs/heads/main
          git merge --no-edit FETCH_HEAD
          head=$(git rev-parse HEAD)
          echo "commit=$head" >> "$GITHUB_OUTPUT"
          echo "tag=git-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$head" != "$previous_head" ]]; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the live Worker version
        id: production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the repository Actions settings.'
            exit 1
          fi
          deployment=$(npx --no-install wrangler deployments status --name mmwx-probe --json)
          active_version=$(jq -r '.versions[] | select(.percentage == 100) | .version_id' <<< "$deployment")
          if [[ -n "$active_version" ]]; then
            active_tag=$(npx --no-install wrangler versions view "$active_version" --name mmwx-probe --json |
              jq -r '.annotations["workers/tag"] // ""')
            if [[ "$active_tag" == "$SOURCE_TAG" ]]; then
              echo 'The current commit is already deployed.'
              echo 'current=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Test and build
        if: steps.production.outputs.current != 'true'
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Push the tested merge
        if: steps.source.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main

      - name: Publish to Cloudflare
        if: steps.production.outputs.current != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_head" != "$SOURCE_COMMIT" ]]; then
            echo '::error::The fork main branch changed during this run. Start a new run from the latest commit.'
            exit 1
          fi
          npx --no-install wrangler deploy --name mmwx-probe --keep-vars \
            --domain status.levinism.com --tag "$SOURCE_TAG" --message "GitHub Actions $SOURCE_COMMIT"

      - name: Verify the published build
        if: steps.production.outputs.current != 'true'
        env:
          PROBE_VERIFY_URL: https://status.levinism.com
        run: node scripts/verify-deploy.mjs
